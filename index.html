<!DOCTYPE html>

<html lang="ja">


<head>


<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1.0">



<title>
World Creator
</title>



<link rel="stylesheet" href="./css/style.css">


</head>



<body>


<div id="app">

</div>



<script 
type="module"
src="./js/core/main.js">

</script>



<script>


if(

"serviceWorker" in navigator

){


window.addEventListener(

"load",

()=>{


navigator.serviceWorker.register(

"./service-worker.js"

)

.catch(

error=>{


console.error(

"Service Worker Error",

error

);


}

);


}

);


}


</script>


</body>


</html>
